<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Mantenedor de Libros</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <header>
        <div class="logo">
            <span class="logo-icon">⚙️</span>
            <div class="logo-text">
                <h1>PANEL ADMIN</h1>
                <span>EL RINCÓN DEL LECTOR</span>
            </div>
        </div>
        <div class="header-actions">
            <a href="../index.html" class="btn-primary" style="text-decoration: none;">Ver Tienda</a>
        </div>
    </header>

    <div class="admin-container">
        <aside class="admin-sidebar">
            <nav>
                <ul class="admin-menu">
                    <li><a href="#" class="active"> Mantenedor Libros</a></li>
                    <li><a href="#"> Mantenedor Usuarios</a></li>
                </ul>
            </nav>
        </aside>

        <main class="admin-content">
            <div class="admin-header-actions">
                <h2>Gestión de Inventario de Libros</h2>
                <button class="btn-primary">+ Agregar Nuevo Libro</button>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Portada</th>
                        <th>Título</th>
                        <th>Autor</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#1</td>
                        <td><img src="https://images.cdn3.buscalibre.com/fit-in/660x660/46/be/46be5fc64a48a48bb1ff9a1f374e2fca.jpg"></td>
                        <td>La Carretera</td>
                        <td>Cormac McCarthy</td>
                        <td>$6.990</td>
                        <td>12</td>

                        <td>
                            <button class="btn-action edit">Editar</button>
                            <button class="btn-action delete">Eliminar</button>
                        </td>
                    </tr>
                    <tr>
                        <td>#2</td>
                        <td><img src="https://images.cdn1.buscalibre.com/fit-in/660x660/ac/8f/ac8fe32fc65b2b118a498168255aa064.jpg"></td>
                        <td>Odisea (Tapa dura)</td>
                        <td>Homero</td>
                        <td>$9.990</td>
                        <td>8</td>
                        <td>
                            <button class="btn-action edit">Editar</button>
                            <button class="btn-action delete">Eliminar</button>
                        </td>
                    </tr>
                                        <tr>
                        <td>#3</td>
                        <td><img src="https://images.cdn3.buscalibre.com/fit-in/660x660/6b/9c/6b9c20bc8e7db10534ddddba3d8d79dc.jpg"></td>
                        <td>Bluebells</td>
                        <td>Francisca Solar</td>
                        <td>$7.990</td>
                        <td>13</td>
                        <td>
                            <button class="btn-action edit">Editar</button>
                            <button class="btn-action delete">Eliminar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

</body>
</html>
